name: DeepPyTorch
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  # Computação científica e análise de dados
  - numpy
  - pandas
  - scipy
  - scikit-learn
  # Visualização e utilitários
  - matplotlib
  - pillow
  - tqdm
  - pyyaml
  # Ambiente interativo
  - jupyter
  - jupyterlab
  - ipywidgets
  # Pacotes gerenciados via pip com suporte a GPU
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch
      - torchvision
      - torchaudio
      - torchmetrics